name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先建空 Release，各平台 job 并行 upload asset
      - run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: flit-macos
          - os: ubuntu-latest
            asset: flit-linux
          - os: windows-latest
            asset: flit-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.1

      - run: dart pub get

      - name: Resolve version from pubspec
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compile
        shell: bash
        run: dart compile exe bin/auto_commit.dart -o "build/${{ matrix.asset }}" -DAPP_VERSION="$VERSION"

      - name: Upload asset
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "build/${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
